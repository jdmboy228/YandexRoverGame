<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ровер: Горячая доставка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#151922;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:absolute;width:450px;height:800px;transform-origin:0 0;overflow:hidden;background:#151922}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.b{position:absolute;z-index:4;border:0;outline:0;border-radius:50%;width:66px;height:66px;font-size:28px;background:rgba(15,20,30,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.b:active{transform:scale(.9)}
#bP,#bS{top:12px;width:44px;height:44px;font-size:20px}
#bP{right:62px}#bS{right:12px;z-index:6}
#bH{left:16px;bottom:22px}#bT{right:16px;bottom:22px}
#app:not(.play) .gb{display:none}
.scr{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(10,14,22,.66)}
.scr.on{display:flex}
h1{font-size:32px;line-height:1.15}h2{font-size:28px}
p{font-size:18px;line-height:1.45;opacity:.92}
small{font-size:13px;opacity:.7;line-height:1.5}
.btn{border:0;outline:0;border-radius:14px;padding:13px 18px;min-width:280px;font-size:18px;font-weight:700;background:#ffcc00;color:#1d1d1d;cursor:pointer}
.btn.g{background:#3a4252;color:#fff}
.btn:disabled{background:#2a303b;color:#7d8696;cursor:default}
.btn:active:not(:disabled){transform:scale(.96)}
#lv{display:flex;flex-direction:column;gap:9px}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<button class="b gb" id="bP">⏸</button>
<button class="b" id="bS">🔊</button>
<button class="b gb" id="bH">📢</button>
<button class="b gb" id="bT">⚡</button>
<div class="scr" id="menu">
<h1>🍲 Ровер:<br>Горячая доставка</h1>
<p id="bal"></p>
<div id="lv"></div>
<small>ПК: ←/→ или A/D — руль, ↑/↓ — скорость,<br>Пробел — гудок, Shift — турбо, P — пауза<br>Телефон: веди пальцем, 📢 гудок, ⚡ турбо</small>
</div>
<div class="scr" id="pause">
<h2>⏸ Пауза</h2>
<button class="btn" id="pC">Продолжить</button>
<button class="btn g" id="pM">В меню</button>
</div>
<div class="scr" id="res">
<h2 id="rT"></h2>
<p id="rP"></p>
<button class="btn" id="r1"></button>
<button class="btn g" id="r2"></button>
</div>
</div>
<script>
const $=i=>document.getElementById(i),app=$('app'),cv=$('c'),ctx=cv.getContext('2d'),dk=document.createElement('canvas'),dctx=dk.getContext('2d');
const W=450,PPM=20,RL=58,RR=392,F='system-ui,Arial,sans-serif',TAU=6.2832;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v;
let H=800,S=1,DPR=1,RY=630,T=0,st='menu',G,ysdk=null,player=null,AC=null,MG=null,adOn=0,hasF=1,played=0,ptr=null,lamps=[];

const LEVELS=[
{n:'Утро в парке',d:500,sp:220,gap:[170,280],sd:'#78b855',wk:['#c7c0b1','#e0dace'],ln:'rgba(0,0,0,.07)',tl:80,tv:0,cb:'#a9a39a',dc:'tree',dk:0,wx:0,sv:220,w:{pig:6,ped:2,pud:2,bat:1.2,bag:1}},
{n:'Обеденный час пик',d:750,sp:250,gap:[130,220],sd:'#8d9096',wk:['#c4977f','#dcb39c'],ln:'rgba(90,45,20,.2)',tl:40,tv:1,cb:'#6f7278',dc:'lamp',dk:0,wx:0,sv:240,w:{ped:7,pig:2,hat:1,sc:1,pud:1,bat:1.3,bag:1}},
{n:'Дождливый вечер',d:1000,sp:270,gap:[120,200],sd:'#34453c',wk:['#59626c','#717b86'],ln:'rgba(255,255,255,.07)',tl:60,tv:1,cb:'#454d57',dc:'tree',dk:'rgba(10,15,45,.5)',wx:1,sv:290,w:{pud:6,ped:3,sc:2,pig:1,hat:1,bat:1.5,bag:1}},
{n:'Ночная смена',d:1250,sp:290,gap:[110,190],sd:'#20242c',wk:['#3c414a','#4b515b'],ln:'rgba(255,255,255,.06)',tl:70,tv:0,cb:'#2d3139',dc:'lamp',dk:'rgba(3,6,20,.9)',wx:0,sv:390,w:{hat:4,sc:4,ped:2,pud:1,pig:1,bat:1.7,bag:1}},
{n:'Зимний шторм',d:1500,sp:300,gap:[95,170],sd:'#e8eef5',wk:['#c1c9d3','#d5dce5'],ln:'rgba(110,130,160,.18)',tl:60,tv:1,cb:'#b5bfcc',dc:'drift',dk:'rgba(30,40,75,.35)',wx:2,gr:8,sv:330,w:{ice:4,ped:4,sc:3,hat:3,pig:2,bat:2,bag:1.2}}];
const OT={pig:{w:14,h:14,d:5},ped:{w:28,h:22,d:15},pud:{w:58,h:30},ice:{w:104,h:74},sc:{w:20,h:44,d:25},hat:{w:46,h:46,d:35},bat:{w:30,h:30},bag:{w:32,h:28}};
const GROUND={pud:1,ice:1,hat:1},COL=['#e74c3c','#3498db','#9b59b6','#f39c12','#16a085','#34495e','#e84393'],HAIR=['#2b1d14','#6b4423','#d9b26a','#111','#8e3b1f'];
const P=Array.from({length:120},()=>({t:0})),TX=Array.from({length:12},()=>({t:0})),DR=Array.from({length:80},()=>({x:R(0,W+150),y:R(0,1000),v:R(120,280),r:R(2,4.5)}));
const K={},GR={};

let save={u:1,b:0,s:1};
try{Object.assign(save,JSON.parse(localStorage.getItem('rover5')||'{}'))}catch(e){}
let snd=save.s!==0;
function persist(){try{localStorage.setItem('rover5',JSON.stringify(save))}catch(e){}try{player&&player.setData(save).catch(()=>{})}catch(e){}}

function resize(){
const iw=innerWidth,ih=innerHeight;
if(ih/iw>800/W){S=iw/W;H=Math.min(1000,ih/S)}else{H=800;S=ih/H}
DPR=Math.min(devicePixelRatio||1,2);RY=H-170;
Object.assign(app.style,{width:W+'px',height:H+'px',left:(iw-W*S)/2+'px',top:(ih-H*S)/2+'px',transform:`scale(${S})`});
cv.width=W*S*DPR|0;cv.height=H*S*DPR|0;dk.width=W/2;dk.height=H/2|0}

function mkGR(){
const rg=(c,r,a,b)=>{const g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,a);g.addColorStop(1,b);return g};
GR.cone=rg(dctx,350,'rgba(0,0,0,1)','rgba(0,0,0,0)');GR.glow=rg(dctx,110,'rgba(0,0,0,.95)','rgba(0,0,0,0)');
GR.beam=rg(ctx,350,'rgba(255,240,180,.3)','rgba(255,240,180,0)')}

function newG(i){
const L=LEVELS[i],g=ctx.createLinearGradient(RL,0,RR,0);
g.addColorStop(0,L.wk[0]);g.addColorStop(.5,L.wk[1]);g.addColorStop(1,L.wk[0]);
return{lv:i,L,wg:g,dist:0,scroll:0,wheel:0,spd:0,soup:100,bat:100,tips:0,x:W/2,vx:0,inv:0,hitT:0,turboT:0,hornCd:0,stunT:0,shake:0,wave:9,next:300,o:[],inPud:0,onIce:0}}

/* ---------- Звук ---------- */
const SFX={horn:[['square',392,392,.28,0],['square',494,494,.28,0]],bonus:[['sine',660,1320,.18,0],['sine',990,1760,.16,.08]],hit:[['sawtooth',220,55,.3,0]],
win:[['triangle',523,523,.16,0],['triangle',659,659,.16,.13],['triangle',784,784,.16,.26],['triangle',1047,1047,.4,.39]],lose:[['sawtooth',320,70,.7,0]],
turbo:[['sawtooth',110,520,.45,0]],warn:[['square',880,880,.07,0],['square',880,880,.07,.14]],click:[['sine',700,900,.06,0]]};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){}}applyAudio()}
function applyAudio(){if(!AC)return;try{const p=snd&&!adOn&&!document.hidden&&hasF?AC.resume():AC.suspend();p&&p.catch&&p.catch(()=>{})}catch(e){}}
function playSound(k){
if(!AC||!snd||adOn)return;const n=AC.currentTime;
for(const[w,f1,f2,d,o]of SFX[k]){const os=AC.createOscillator(),g=AC.createGain();os.type=w;
os.frequency.setValueAtTime(f1,n+o);os.frequency.exponentialRampToValueAtTime(f2,n+o+d);
g.gain.setValueAtTime(.0001,n);g.gain.setValueAtTime(.22,n+o);g.gain.exponentialRampToValueAtTime(.001,n+o+d);
os.connect(g);g.connect(MG);os.start(n);os.stop(n+o+d+.03)}}

/* ---------- SDK ---------- */
function initSDK(){
if(ysdk||!window.YaGames)return;
YaGames.init().then(s=>{ysdk=s;s.features.LoadingAPI?.ready();
s.getPlayer({scopes:false}).then(p=>{player=p;return p.getData()}).then(d=>{
if(d&&((d.u|0)>save.u||(d.b|0)>save.b)){save.u=Math.max(save.u,d.u|0);save.b=Math.max(save.b,d.b|0);persist();if(st=='menu')menu()}}).catch(()=>{})}).catch(()=>{})}
const gp=on=>{try{ysdk?.features?.GameplayAPI?.[on?'start':'stop']()}catch(e){}};
function showAd(cb){
if(!ysdk)return cb();let done=0;const end=()=>{if(done)return;done=1;adOn=0;applyAudio();cb()};
st='ad';adOn=1;applyAudio();
try{ysdk.adv.showFullscreenAdv({callbacks:{onOpen:()=>{adOn=1;applyAudio()},onClose:end,onError:end,onOffline:end}})}catch(e){end()}}

/* ---------- Экраны ---------- */
function show(id){for(const s of document.querySelectorAll('.scr'))s.classList.toggle('on',s.id==id)}
function menu(){
st='menu';app.classList.remove('play');gp(0);G=newG(Math.min(save.u,5)-1);show('menu');
$('bal').textContent=`💰 Чаевые: ${save.b} ₽`;const box=$('lv');box.innerHTML='';
LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.className='btn';b.disabled=i>=save.u;
b.textContent=(i<save.u?'':'🔒 ')+`${i+1}. ${l.n} · ${l.d} м`;b.onclick=()=>{ac();playSound('click');startLevel(i)};box.appendChild(b)})}
function result(t,html,a,fa,b,fb){
st='end';gp(0);app.classList.remove('play');$('rT').textContent=t;$('rP').innerHTML=html;
const r1=$('r1'),r2=$('r2');r1.textContent=a;r1.onclick=()=>{ac();fa()};r2.style.display=b?'':'none';r2.textContent=b||'';r2.onclick=fb;show('res')}
function startLevel(i){show(null);if(played)showAd(()=>begin(i));else begin(i);played=1}
function begin(i){G=newG(i);for(const p of P)p.t=0;for(const p of TX)p.t=0;st='play';app.classList.add('play');show(null);gp(1)}
function setPause(p){
if(p&&st=='play'){st='pause';show('pause');gp(0)}
else if(!p&&st=='pause'){st='play';show(null);gp(1)}}
function finish(){
const L=G.L,tip=Math.round(40+G.lv*30+G.soup*.8+G.bat*.3)+G.tips;
save.b+=tip;save.u=Math.max(save.u,Math.min(5,G.lv+2));persist();playSound('win');
const s=`🍲 Суп: ${Math.ceil(G.soup)}%<br>🔋 Батарея: ${Math.ceil(G.bat)}%<br>💰 Чаевые: +${tip} ₽`;
if(G.lv==4)result('🏆 Все заказы доставлены!',`${s}<br><br>Вы — лучший ровер города!<br>Всего чаевых: ${save.b} ₽`,'В меню',menu);
else result('✅ Заказ доставлен!',`«${L.n}» пройден<br>${s}`,'Следующий уровень ▶',()=>startLevel(G.lv+1),'В меню',menu)}
function over(bat){
playSound('lose');const i=G.lv;
result('💥 Заказ провален',bat?'🔋 Батарея села.<br>Ровер уснул посреди тротуара.':'🍲 Суп разлит!<br>Клиент остался без обеда.','Ещё раз ↻',()=>startLevel(i),'В меню',menu)}
function toggleSnd(){snd=!snd;save.s=snd?1:0;persist();$('bS').textContent=snd?'🔊':'🔇';ac();playSound('click')}

/* ---------- Эффекты ---------- */
function part(x,y,n,c,sp,life){for(const p of P){if(n<=0)break;if(p.t>0)continue;const a=R(0,TAU),v=sp*R(.3,1);
p.x=x;p.y=y;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v;p.t=p.m=life;p.c=c;n--}}
function ft(x,y,s,c){const p=TX.find(p=>p.t<=0)||TX[0];Object.assign(p,{x,y,s,c,t:1.1})}
function dmg(o,v){
o.done=1;if(G.inv>0)return;G.soup=Math.max(0,G.soup-v);G.inv=1;G.hitT=.6;G.shake=.3;
ft(G.x,RY-56,`-${v}% 🍲`,'#ff5a4d');playSound('hit');part(G.x,RY-30,12,'#ffcf6b',170,.5);try{navigator.vibrate&&navigator.vibrate(35)}catch(e){}}
function flee(o){o.fly=1;o.vx=(o.x<G.x?-1:1)*R(170,290);o.vy=-R(200,320);part(o.x,o.y,3,'#c9ced6',60,.6)}
function horn(){
if(st!='play'||G.hornCd>0)return;if(G.bat<=3)return ft(G.x,RY-60,'Мало заряда','#ff5a4d');
G.bat-=3;G.hornCd=.7;G.wave=0;playSound('horn');
for(const o of G.o){const d=RY-o.y;if(d<-40||d>400)continue;
if(o.t=='pig'&&!o.fly)flee(o);else if(o.t=='ped'&&!o.done)o.tx=o.x<G.x?RL+16:RR-16}}
function turbo(){if(st!='play'||G.turboT>0||G.bat<6)return;G.turboT=2.5;playSound('turbo');ft(G.x,RY-60,'⚡ Турбо!','#6cf')}
function pick(w){let t=0,k;for(k in w)t+=w[k];let r=Math.random()*t;for(k in w)if((r-=w[k])<0)return k;return k}
function spawn(){
const L=G.L,t=pick(L.w),x=R(RL+26,RR-26),o=G.o;
if(t=='pig')for(let i=3+(Math.random()*4|0);i--;)o.push({t,x:cl(x+R(-36,36),RL+10,RR-10),y:R(-45,5),late:Math.random()<.55,a:R(0,TAU)});
else if(t=='sc'){o.push({t:'warn',x,y:-100,tm:1});playSound('warn')}
else if(t=='ped')o.push({t,x,y:-40,vy:R(40,80),k:R(0,9),p:Math.random()<(G.lv?.6:.3),c:COL[Math.random()*7|0],h:HAIR[Math.random()*5|0]});
else o.push({t,x,y:-60})}

/* ---------- Логика ---------- */
function update(dt){
const L=G.L,goal=L.d*PPM;
G.inv-=dt;G.hitT-=dt;G.turboT-=dt;G.hornCd-=dt;G.stunT-=dt;G.shake=Math.max(0,G.shake-dt);G.wave+=dt*2;
let m=G.turboT>0?1.6:(K.ArrowUp|K.KeyW)?1.25:1;if(K.ArrowDown|K.KeyS)m*=.6;if(G.inPud)m*=.55;if(G.stunT>0)m*=.3;
G.spd+=(L.sp*m-G.spd)*Math.min(1,3*dt);
const dy=G.spd*dt;G.dist+=dy;G.scroll+=dy;G.wheel+=dy;
G.bat-=dy/goal*62+(G.turboT>0?5*dt:0);
const kx=(K.ArrowRight|K.KeyD)-(K.ArrowLeft|K.KeyA),want=ptr!=null?cl((ptr-G.x)*9,-480,480):kx*380;
G.vx+=(want-G.vx)*Math.min(1,(G.onIce?2.2:L.gr||14)*dt);G.x+=G.vx*dt;
if(G.x<RL+28||G.x>RR-28){G.x=cl(G.x,RL+28,RR-28);G.vx*=-.3}
if((G.next-=dy)<=0&&G.dist<goal-500){spawn();G.next=R(L.gap[0],L.gap[1])}
G.inPud=G.onIce=0;
for(const o of G.o){
if(o.t=='warn'){if((o.tm-=dt)<=0){o.t='sc';o.y=-60;o.vy=L.sv;o.c=COL[Math.random()*7|0]}continue}
o.y+=dy+(o.vy||0)*dt;o.k=(o.k||0)+dt;
const d=OT[o.t],near=Math.abs(o.x-G.x)<(d.w+36)/2&&Math.abs(o.y-RY)<(d.h+56)/2;
switch(o.t){
case'pig':if(o.fly)o.x+=o.vx*dt;else if(o.late&&RY-o.y<110&&RY-o.y>20)flee(o);else if(near){dmg(o,d.d);flee(o)}break;
case'ped':if(o.p&&o.tx==null)o.x+=Math.sin(o.k*2.2)*50*dt;
if(o.tx!=null)o.x+=Math.sign(o.tx-o.x)*Math.min(Math.abs(o.tx-o.x),150*dt);o.x=cl(o.x,RL+14,RR-14);
if(near&&!o.done)dmg(o,d.d);break;
case'sc':case'hat':if(near&&!o.done){dmg(o,d.d);if(o.t=='hat'){G.stunT=1;G.spd*=.35}}break;
case'pud':if(near){G.inPud=1;if(Math.random()<dt*14)part(G.x+R(-20,20),RY-22,2,'#a8c8ff',90,.4)}break;
case'ice':if(near)G.onIce=1;break;
case'bat':if(near){o.dead=1;G.bat=Math.min(100,G.bat+25);ft(o.x,o.y,'+25% 🔋','#5f5');playSound('bonus');part(o.x,o.y,10,'#5f5',140,.5)}break;
case'bag':if(near){o.dead=1;G.soup=Math.min(100,G.soup+15);G.tips+=50;ft(o.x,o.y,'+15% 🍲 +50 ₽','#ffd23f');playSound('bonus');part(o.x,o.y,10,'#ffd23f',140,.5)}}}
let j=0;for(const o of G.o)if(!o.dead&&o.y<H+90&&o.x>-80&&o.x<W+80)G.o[j++]=o;G.o.length=j;
if(G.turboT>0)part(G.x+R(-12,12),RY+36,2,Math.random()<.5?'#6cf':'#fff',50,.35);
if(G.soup<=0)over(0);else if(G.bat<=0)over(1);else if(G.dist>=goal)finish()}

/* ---------- Рисование ---------- */
const ell=(x,y,a,b)=>{ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,TAU);ctx.fill()};
const arc=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()};
function rr(x,y,w,h,r){const c=ctx;r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.fill()}
function cone(x,y){const c=ctx;c.fillStyle='rgba(0,0,0,.2)';ell(x+3,y+3,9,9);c.fillStyle='#d9480f';c.fillRect(x-8,y-8,16,16);c.fillStyle='#ff7a1f';arc(x,y,7);c.fillStyle='#fff';arc(x,y,4.6);c.fillStyle='#ff7a1f';arc(x,y,2.6)}

function deco(t,x,y,i){
const c=ctx,L=G.L,left=x<W/2;
if(t=='tree'){c.fillStyle='rgba(0,0,0,.2)';ell(x+6,y+7,24,20);const wet=G.lv==2;c.fillStyle=wet?'#2c5a38':'#3f8f3a';arc(x,y,22);c.fillStyle=wet?'#3a6f47':'#58ad48';arc(x-6,y-6,12);
if(i%3==0){c.fillStyle=wet?'#4a5560':'#8a6a4a';c.fillRect(x-6,y+60,12,30)}}
else if(t=='lamp'){const lx=x+(left?16:-16);c.strokeStyle='#4d535d';c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(lx,y);c.stroke();
c.fillStyle='rgba(0,0,0,.25)';arc(x+3,y+3,7);c.fillStyle='#555b66';arc(x,y,6);c.fillStyle=L.dk?'#ffe9a0':'#cfd5dd';arc(lx,y,5);
if(L.dk)lamps.push([left?RL+14:RR-14,y,1]);if(i%2){c.fillStyle='#7a5a3c';c.fillRect(left?x-10:x-6,y+80,16,40)}}
else{c.fillStyle='#cdd7e4';ell(x+4,y+7,30,22);c.fillStyle='#fff';ell(x,y,28,20);ell(x+(i%3-1)*9,y-18,18,13);ell(left?x+20:x-20,y+40,10,24)}}

function bg(){
const c=ctx,L=G.L,s=G.scroll,t=L.tl;
c.fillStyle=L.sd;c.fillRect(0,0,W,H);c.fillStyle=G.wg;c.fillRect(RL,0,RR-RL,H);
c.fillStyle=L.cb;c.fillRect(RL-7,0,7,H);c.fillRect(RR,0,7,H);
c.strokeStyle=L.ln;c.lineWidth=2;c.beginPath();
for(let y=s%t-t;y<H;y+=t){c.moveTo(RL,y);c.lineTo(RR,y)}
if(L.tv)for(let x=RL+t;x<RR;x+=t){c.moveTo(x,0);c.lineTo(x,H)}
c.stroke();lamps.length=0;
for(let i=0,n=Math.ceil(H/180)+2;i<n;i++)deco(L.dc,i%2?25:W-25,(i*180+s)%(n*180)-180,i);
const fy=RY-30-(L.d*PPM-G.dist);
if(st!='menu'&&fy>-30&&fy<H)for(let i=0;i<15;i++)for(let k=0;k<2;k++){c.fillStyle=(i+k)%2?'#fff':'#222';c.fillRect(RL+i*22.27,fy+k*12,22.3,12)}}

function drawO(o){
const c=ctx,x=o.x,y=o.y;
switch(o.t){
case'pud':c.fillStyle='rgba(70,120,190,.45)';ell(x,y,32,17);c.fillStyle='rgba(255,255,255,.25)';ell(x-9,y-5,12,4);
if(G.L.wx==1){c.strokeStyle='rgba(200,220,255,.35)';c.lineWidth=1;c.beginPath();c.ellipse(x+6,y+2,(T*20+x)%14+2,((T*20+x)%14+2)*.5,0,0,TAU);c.stroke()}break;
case'ice':c.fillStyle='rgba(195,232,255,.6)';rr(x-52,y-37,104,74,24);c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();
c.moveTo(x-32,y-14);c.lineTo(x+8,y-24);c.moveTo(x-18,y+14);c.lineTo(x+32,y+2);c.moveTo(x-38,y+4);c.lineTo(x-24,y);c.stroke();break;
case'hat':c.fillStyle='#6a6e75';arc(x,y,21);c.fillStyle='#0b0d10';arc(x,y,16);cone(x-27,y-20);cone(x+27,y-17);cone(x+3,y+29);break;
case'bat':{const p=1+Math.sin(T*6)*.08;c.save();c.translate(x,y);c.scale(p,p);c.fillStyle='rgba(60,230,110,.25)';arc(0,0,21);c.fillStyle='#22c55e';arc(0,0,15);
c.fillStyle='#fff';c.beginPath();c.moveTo(3,-11);c.lineTo(-7,2);c.lineTo(-1,2);c.lineTo(-3,11);c.lineTo(7,-2);c.lineTo(1,-2);c.fill();c.restore();break}
case'bag':c.fillStyle='rgba(0,0,0,.2)';ell(x+3,y+5,17,13);c.fillStyle='#ff9f1a';rr(x-16,y-13,32,26,6);c.fillStyle='#ffd23f';c.fillRect(x-16,y-3,32,6);
c.fillStyle='#fff';c.font='bold 15px '+F;c.textAlign='center';c.fillText('+',x,y+1);break;
case'pig':c.save();c.translate(x,y);
if(o.fly){c.fillStyle='rgba(0,0,0,.15)';ell(12,24,7,4);c.rotate(Math.atan2(o.vy,o.vx)+1.571);c.scale(1.25,1.25);const f=Math.abs(Math.sin(T*28))*4+1;c.fillStyle='#a6acb6';ell(-9,0,9,f);ell(9,0,9,f)}
else{c.rotate(o.a+Math.sin(T*6+x)*.25);c.fillStyle='rgba(0,0,0,.18)';ell(2,3,7,9)}
c.fillStyle='#8b919c';ell(0,1,6,9);c.fillStyle='#6b8f86';arc(0,-6,4.2);c.fillStyle='#596170';arc(0,-8,3.5);c.fillStyle='#f0a030';c.fillRect(-1,-13,2,3);c.restore();break;
case'ped':{const s=Math.sin(o.k*7)*5;c.globalAlpha=o.done?.55:1;c.fillStyle='rgba(0,0,0,.2)';ell(x+3,y+4,15,10);c.fillStyle='#2c2f38';ell(x-5,y+s,4,6);ell(x+5,y-s,4,6);
c.fillStyle=o.c;ell(x,y,14,8);if(o.p){c.fillStyle='#f1c27d';arc(x-4,y+9,2.6);arc(x+4,y+9,2.6);c.fillStyle='#8fe3ff';c.fillRect(x-3,y+8,6,5)}
c.fillStyle=o.h;arc(x,y+1,6.5);c.globalAlpha=1;break}
case'sc':c.fillStyle='rgba(0,0,0,.2)';ell(x+3,y+4,10,24);c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.moveTo(x-8,y-30);c.lineTo(x-8,y-50);c.moveTo(x+8,y-30);c.lineTo(x+8,y-56);c.stroke();
c.fillStyle='#2b2e35';rr(x-5,y-22,10,44,4);c.fillStyle='#111';c.fillRect(x-3,y-26,6,7);c.fillRect(x-3,y+19,6,7);
c.strokeStyle='#999';c.lineWidth=3;c.beginPath();c.moveTo(x-12,y+15);c.lineTo(x+12,y+15);c.stroke();c.fillStyle=o.c;ell(x,y+2,11,7);c.fillStyle='#e74c3c';arc(x,y+4,5.5);break;
case'warn':if((T*8|0)%2){c.fillStyle='#ffcc00';c.beginPath();c.moveTo(x,112);c.lineTo(x+17,142);c.lineTo(x-17,142);c.fill();c.fillStyle='#222';c.font='bold 19px '+F;c.textAlign='center';c.fillText('!',x,131)}}}

function rover(x,y){
const c=ctx,night=!!G.L.dk;c.save();c.translate(x,y);
c.fillStyle='rgba(0,0,0,.22)';ell(4,7,30,40);
const off=G.wheel*.6%5;
for(const sx of[-1,1])for(let k=-1;k<2;k++){const wx=sx*24-5,wy=k*22-8;c.fillStyle='#121315';rr(wx,wy,10,16,3);c.fillStyle='#3d4046';for(let j=0;j<3;j++)c.fillRect(wx,wy+(off+j*5)%15,10,1.5)}
c.fillStyle=G.hitT>0&&(T*20|0)%2?'#ff5e5e':'#f4f6f8';rr(-20,-33,40,66,12);
c.fillStyle='#dfe4ea';rr(-18,19,36,11,4);c.fillStyle='#c9d0d8';c.fillRect(-20,-6,2,24);c.fillRect(18,-6,2,24);
c.fillStyle='#2a2e35';rr(-14,-13,28,30,6);c.fillStyle='#3b414b';c.fillRect(-12,1,24,1.5);c.fillStyle='#ffcc00';c.fillRect(-4,10,8,3);
c.fillStyle=`hsl(185,100%,${night?70:55+Math.sin(T*6)*12}%)`;rr(-15,-32,30,4,2);
if(night){c.fillStyle='#fff8d0';arc(-14,-30,3);arc(14,-30,3)}
c.fillStyle='#1d2025';arc(0,-22,6.5);c.fillStyle='#3a3f47';arc(0,-22,4.5);
c.save();c.translate(0,-22);c.rotate(T*7);c.fillStyle='#4ff0ff';c.fillRect(0,-1.5,6.5,3);c.restore();
const sw=-G.vx*.03+Math.sin(T*8)*2,ax=-12+sw,ay=68;
c.strokeStyle='#2b2e35';c.lineWidth=2;c.beginPath();c.moveTo(-12,26);c.quadraticCurveTo(-12+sw*.4,48,ax,ay);c.stroke();
c.fillStyle='#ff4d1a';c.beginPath();c.moveTo(ax,ay-12);c.lineTo(ax+16+Math.sin(T*12)*3,ay-8);c.lineTo(ax,ay-2);c.fill();
c.restore()}

function dark(){
const d=dctx,L=G.L;d.setTransform(.5,0,0,.5,0,0);d.globalCompositeOperation='source-over';d.clearRect(0,0,W,H);d.fillStyle=L.dk;d.fillRect(0,0,W,H);
d.globalCompositeOperation='destination-out';d.save();d.translate(G.x,RY-28);d.fillStyle=GR.cone;d.beginPath();d.moveTo(-16,0);d.lineTo(-135,-345);d.lineTo(135,-345);d.lineTo(16,0);d.fill();d.restore();
lamps.push([G.x,RY,.7]);
for(const p of lamps){d.save();d.translate(p[0],p[1]);d.scale(p[2],p[2]);d.fillStyle=GR.glow;d.beginPath();d.arc(0,0,110,0,TAU);d.fill();d.restore()}
d.globalCompositeOperation='source-over';ctx.drawImage(dk,0,0,W,H);
ctx.save();ctx.translate(G.x,RY-28);ctx.fillStyle=GR.beam;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-135,-345);ctx.lineTo(135,-345);ctx.lineTo(16,0);ctx.fill();ctx.restore()}

function weather(a){
const c=ctx,w=G.L.wx;if(!w)return;
if(w==1){c.strokeStyle='rgba(170,195,255,.45)';c.lineWidth=1.3}else c.fillStyle='rgba(255,255,255,.85)';c.beginPath();
for(const p of DR){
if(w==1){p.y+=900*a;p.x-=280*a}else{p.y+=p.v*a;p.x+=(Math.sin(T+p.v)*30-70)*a}
if(p.y>H){p.y-=H+30;p.x=R(0,W+150)}if(p.x<-20)p.x+=W+150;
if(w==1){c.moveTo(p.x,p.y);c.lineTo(p.x-6,p.y+19)}else c.rect(p.x,p.y,p.r,p.r)}
w==1?c.stroke():c.fill()}

function bar(y,ic,v,col){
const c=ctx;c.textAlign='left';c.font='15px '+F;c.fillStyle='#fff';c.fillText(ic,16,y);
c.fillStyle='rgba(255,255,255,.16)';rr(42,y-7,170,14,7);c.fillStyle=col;if(v>0)rr(42,y-7,1.7*v,14,7);
c.fillStyle='#fff';c.font='bold 13px '+F;c.fillText(Math.ceil(v)+'%',218,y)}
function hud(){
const c=ctx,L=G.L,goal=L.d*PPM;
c.fillStyle='rgba(12,16,24,.62)';rr(8,8,326,96,14);
c.fillStyle='#fff';c.font='bold 16px '+F;c.textAlign='left';c.fillText(`${G.lv+1}. ${L.n}`,16,28);
c.textAlign='right';c.fillText(`🏁 ${Math.max(0,Math.ceil((goal-G.dist)/PPM))} м`,326,28);
bar(52,'🍲',G.soup,G.soup<30?'#ff5a4d':'#ffb020');bar(77,'🔋',G.bat,G.bat<25?'#ff5a4d':'#3ddc6a');
c.textAlign='right';c.font='bold 14px '+F;c.fillStyle='#ffd23f';c.fillText(`💰 ${G.tips} ₽`,326,64);
c.fillStyle='rgba(255,255,255,.15)';c.fillRect(16,95,310,3);c.fillStyle='#ffcc00';c.fillRect(16,95,310*Math.min(1,G.dist/goal),3)}

function render(a){
const c=ctx,sh=G.shake*18;
c.setTransform(S*DPR,0,0,S*DPR,0,0);c.textBaseline='middle';if(sh)c.translate(R(-sh,sh),R(-sh,sh));
bg();
for(const o of G.o)if(GROUND[o.t])drawO(o);
for(const o of G.o)if(!GROUND[o.t]&&!o.fly&&o.t!='warn')drawO(o);
rover(G.x,RY);
for(const o of G.o)if(o.fly)drawO(o);
for(const p of P)if(p.t>0){p.t-=a;p.x+=p.vx*a;p.y+=(p.vy+(st=='play'?G.spd:0))*a;c.globalAlpha=Math.max(0,p.t/p.m);c.fillStyle=p.c;c.fillRect(p.x-2,p.y-2,4,4)}
c.globalAlpha=1;
if(G.L.dk)dark();
weather(a);
if(G.wave<1){c.strokeStyle=`rgba(255,220,80,${1-G.wave})`;c.lineWidth=4;c.beginPath();c.arc(G.x,RY-20,30+G.wave*260,0,TAU);c.stroke()}
c.setTransform(S*DPR,0,0,S*DPR,0,0);
for(const o of G.o)if(o.t=='warn')drawO(o);
c.textAlign='center';c.font='bold 20px '+F;c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.6)';
for(const p of TX)if(p.t>0){p.t-=a;p.y-=50*a;c.globalAlpha=Math.min(1,p.t*2);c.strokeText(p.s,p.x,p.y);c.fillStyle=p.c;c.fillText(p.s,p.x,p.y)}
c.globalAlpha=1;
if(st!='menu')hud()}

let last=performance.now();
function loop(n){
requestAnimationFrame(loop);const dt=Math.min(Math.max(0,(n-last)/1000),.1);last=n;
const a=st=='play'||st=='menu'?dt:0;T+=a;
if(st=='play')update(dt);else if(st=='menu'){G.scroll+=70*dt;G.wheel+=70*dt}
render(a)}

/* ---------- Ввод и системные события ---------- */
addEventListener('keydown',e=>{
const c=e.code;if(/^Arrow|^Space$/.test(c))e.preventDefault();K[c]=1;if(e.repeat)return;ac();
if(c=='Space')horn();else if(c=='ShiftLeft'||c=='ShiftRight'||c=='KeyE')turbo();else if(c=='Escape'||c=='KeyP')st=='play'?setPause(1):setPause(0)});
addEventListener('keyup',e=>{K[e.code]=0});
const px=e=>{const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W};
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();ptr=px(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(ptr!=null)ptr=px(e)});
for(const n of['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(n,()=>{ptr=null});
const tap=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ac();f()});
tap('bH',horn);tap('bT',turbo);tap('bP',()=>setPause(1));tap('bS',toggleSnd);
$('pC').onclick=()=>setPause(0);$('pM').onclick=menu;
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){setPause(1);for(const k in K)K[k]=0;ptr=null}applyAudio()});
addEventListener('blur',()=>{hasF=0;setPause(1);for(const k in K)K[k]=0;ptr=null;applyAudio()});
addEventListener('focus',()=>{hasF=1;applyAudio()});
addEventListener('resize',resize);

resize();mkGR();$('bS').textContent=snd?'🔊':'🔇';menu();requestAnimationFrame(loop);
if(window.YaGames)initSDK();
</script>
